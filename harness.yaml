name: wv-opencode-central
agent: opencode
size: mars-1vcpu-1gb
idle_timeout: 15m
persistent_workspace: true
env: {}
secrets:
  OPENCODE_API_KEY: ${OPENCODE_API_KEY}
  WV_ZAI_API_KEY: ${WV_ZAI_API_KEY}
  WV_DASHSCOPE_API_KEY: ${WV_DASHSCOPE_API_KEY}
  WV_SAKANA_API_KEY: ${WV_SAKANA_API_KEY}
  WV_DEEPSEEK_API_KEY: ${WV_DEEPSEEK_API_KEY}
  WV_XIAOMI_TOKEN_PLAN_API_KEY: ${WV_XIAOMI_TOKEN_PLAN_API_KEY}
  WV_NOUS_API_KEY: ${WV_NOUS_API_KEY}
egress: unrestricted
tools: []
permissions:
  default: ask
